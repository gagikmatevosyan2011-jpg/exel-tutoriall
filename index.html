                            Հաջորդը <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderSandboxView(container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                <i data-lucide="grid" class="w-6 h-6 text-excel-500"></i> Excel Ինտերակտիվ Սիմուլյատոր
                            </h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                Փոփոխեք թվերը, գրեք բանաձևեր (օրինակ՝ <code>=SUM(B2:B4)</code> կամ <code>=B2*C2</code>) և տեսեք արդյունքը:
                            </p>
                        </div>
                        <button onclick="resetGridData()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-200 transition flex items-center gap-1">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Վերականգնել
                        </button>
                    </div>

                    <!-- Active Formula Bar -->
                    <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                        <span id="active-cell-id" class="font-mono font-bold text-excel-600 dark:text-excel-400 text-sm w-12 text-center bg-white dark:bg-slate-800 py-1 rounded border dark:border-slate-700">A1</span>
                        <span class="font-serif italic font-bold text-slate-400">fx</span>
                        <input type="text" id="formula-bar-input" class="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded px-3 py-1 text-sm font-mono focus:outline-none focus:border-excel-500 text-slate-800 dark:text-slate-100" placeholder="Մուտքագրեք արժեք կամ բանաձև...">
                    </div>

                    <!-- Excel Table Grid -->
                    <div class="overflow-x-auto border border-slate-300 dark:border-slate-700 rounded-xl shadow-inner">
                        <table class="w-full border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300 font-mono text-xs text-center border-b border-slate-300 dark:border-slate-700">
                                    <th class="w-10 p-2 border-r border-slate-300 dark:border-slate-700 bg-slate-200/60 dark:bg-slate-800"></th>
                                    <th class="w-1/4 p-2 border-r border-slate-300 dark:border-slate-700">A</th>
                                    <th class="w-1/4 p-2 border-r border-slate-300 dark:border-slate-700">B</th>
                                    <th class="w-1/4 p-2 border-r border-slate-300 dark:border-slate-700">C</th>
                                    <th class="w-1/4 p-2">D</th>
                                </tr>
                            </thead>
                            <tbody id="excel-grid-body" class="font-sans">
                                <!-- Generated JS Grid -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Helpful Formula Hints -->
                    <div class="p-4 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl border border-emerald-200 dark:border-emerald-800/50 text-xs space-y-2 text-emerald-800 dark:text-emerald-300">
                        <div class="font-bold flex items-center gap-1"><i data-lucide="sparkles" class="w-4 h-4"></i> Փորձարկիր հետևյալ բանաձևերը.</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 font-mono">
                            <div>• <code>=SUM(B2:B4)</code> - Գումարել B2-ից B4</div>
                            <div>• <code>=AVERAGE(C2:C4)</code> - Գնի միջինը</div>
                            <div>• <code>=B2*C2</code> - Բազմապատկել քանակը գնով</div>
                            <div>• <code>=MAX(D2:D4)</code> - Առավելագույն գումարը</div>
                        </div>
                    </div>
                </div>
            `;

            renderGridCells();
        }

        function renderGridCells() {
            const tbody = document.getElementById('excel-grid-body');
            if (!tbody) return;

            tbody.innerHTML = '';
            const cols = ['A', 'B', 'C', 'D'];
            const rows = [1, 2, 3, 4, 5];

            rows.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-200 dark:border-slate-700/60';

                // Row Header Number
                const th = document.createElement('td');
                th.className = 'bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 font-mono text-xs text-center border-r border-slate-200 dark:border-slate-700 p-2 font-semibold select-none';
                th.innerText = r;
                tr.appendChild(th);

                cols.forEach(c => {
                    const cellId = `${c}${r}`;
                    const rawVal = state.gridData[cellId] || '';
                    const displayVal = evaluateFormula(rawVal);

                    const td = document.createElement('td');
                    td.className = 'border-r border-slate-200 dark:border-slate-700 p-0 relative hover:bg-slate-50 dark:hover:bg-slate-700/30';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = displayVal;
                    input.dataset.cellId = cellId;
                    input.className = `w-full h-full px-3 py-2 text-sm bg-transparent border-none cell-input text-slate-800 dark:text-slate-100 ${r === 1 ? 'font-bold bg-slate-50/50 dark:bg-slate-800/50' : ''}`;

                    input.addEventListener('focus', () => {
                        document.getElementById('active-cell-id').innerText = cellId;
                        const fInput = document.getElementById('formula-bar-input');
                        fInput.value = state.gridData[cellId] || '';
                        fInput.dataset.activeCell = cellId;
                    });

                    input.addEventListener('change', (e) => {
                        updateCellValue(cellId, e.target.value);
                    });

                    td.appendChild(input);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            // Synchronize Formula Bar
            const fInput = document.getElementById('formula-bar-input');
            if (fInput) {
                fInput.onchange = (e) => {
                    const activeCell = fInput.dataset.activeCell || 'A1';
                    updateCellValue(activeCell, e.target.value);
                };
            }
        }

        function updateCellValue(cellId, val) {
            state.gridData[cellId] = val;
            renderGridCells();
        }

        function resetGridData() {
            state.gridData = {
                'A1': 'Ապրանք', 'B1': 'Քանակ', 'C1': 'Գին', 'D1': 'Ընդամենը',
                'A2': 'Խնձոր', 'B2': '10', 'C2': '400', 'D2': '=B2*C2',
                'A3': 'Տանձ', 'B3': '5', 'C3': '600', 'D3': '=B3*C3',
                'A4': 'Բանան', 'B4': '12', 'C4': '800', 'D4': '=B4*C4',
                'A5': 'Ընդամենը', 'B5': '=SUM(B2:B4)', 'C5': '-', 'D5': '=SUM(D2:D4)'
            };
            renderGridCells();
        }

        /* Simple Formula Interpreter for Excel Sandbox */
        function evaluateFormula(expr) {
            if (!expr || typeof expr !== 'string') return expr;
            if (!expr.startsWith('=')) return expr;

            try {
                let clean = expr.substring(1).trim().toUpperCase();

                // Handle SUM range: SUM(B2:B4)
                if (clean.startsWith('SUM(') && clean.endsWith(')')) {
                    const range = clean.substring(4, clean.length - 1);
                    const values = getRangeValues(range);
                    return values.reduce((a, b) => a + b, 0);
                }

                // Handle AVERAGE range: AVERAGE(C2:C4)
                if (clean.startsWith('AVERAGE(') && clean.endsWith(')')) {
                    const range = clean.substring(8, clean.length - 1);
                    const values = getRangeValues(range);
                    return values.length ? (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1) : 0;
                }

                // Handle MAX range: MAX(D2:D4)
                if (clean.startsWith('MAX(') && clean.endsWith(')')) {
                    const range = clean.substring(4, clean.length - 1);
                    const values = getRangeValues(range);
                    return values.length ? Math.max(...values) : 0;
                }

                // Simple arithmetic like B2*C2 or A1+10
                let replaced = clean.replace(/([A-D][1-5])/g, (match) => {
                    let val = evaluateFormula(state.gridData[match] || '0');
                    return isNaN(Number(val)) ? 0 : Number(val);
                });

                // Safe evaluation of simple math operators
                if (/^[0-9\.\+\-\*\/\(\)\s]+$/.test(replaced)) {
                    return eval(replaced);
                }

                return '#ERROR!';
            } catch (err) {
                return '#VALUE!';
            }
        }

        function getRangeValues(rangeStr) {
            const parts = rangeStr.split(':');
            if (parts.length !== 2) return [];

            const startCol = parts[0][0];
            const startRow = parseInt(parts[0].substring(1));
            const endCol = parts[1][0];
            const endRow = parseInt(parts[1].substring(1));

            let values = [];
            const cols = ['A', 'B', 'C', 'D'];
            const startColIdx = cols.indexOf(startCol);
            const endColIdx = cols.indexOf(endCol);

            for (let c = startColIdx; c <= endColIdx; c++) {
                for (let r = startRow; r <= endRow; r++) {
                    let cellKey = `${cols[c]}${r}`;
                    let val = evaluateFormula(state.gridData[cellKey] || '0');
                    let num = parseFloat(val);
                    if (!isNaN(num)) values.push(num);
                }
            }
            return values;
        }

        function renderQuizView(container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i data-lucide="help-circle" class="w-6 h-6 text-excel-500"></i> MS Excel Ամփոփիչ Թեստ
                        </h2>
                        <p class="text-slate-600 dark:text-slate-300 text-sm mt-1">
                            Ստուգեք ձեր գիտելիքները անցած դասերից:
                        </p>
                    </div>

                    <form id="quiz-form" class="space-y-6">
                        ${quizQuestions.map((q, idx) => `
                            <div class="p-5 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200 dark:border-slate-700 space-y-3">
                                <h4 class="font-bold text-slate-800 dark:text-slate-100">${q.question}</h4>
                                <div class="space-y-2">
                                    ${q.options.map((opt, oIdx) => `
                                        <label class="flex items-center gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-excel-500 transition">
                                            <input type="radio" name="q_${idx}" value="${oIdx}" class="text-excel-500 focus:ring-excel-500">
                                            <span class="text-sm text-slate-700 dark:text-slate-200">${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}

                        <button type="button" onclick="submitQuiz()" class="w-full py-3 bg-excel-500 hover:bg-excel-600 text-white font-bold rounded-xl shadow-md shadow-excel-500/20 transition flex items-center justify-center gap-2">
                            <i data-lucide="check-circle" class="w-5 h-5"></i> Ստուգել Արդյունքները
                        </button>
                    </form>

                    <div id="quiz-results" class="hidden p-5 rounded-xl border text-center space-y-2"></div>
                </div>
            `;
            initLucide();
        }

        function submitQuiz() {
            let score = 0;
            quizQuestions.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.correct) {
                    score++;
                }
            });

            const resDiv = document.getElementById('quiz-results');
            resDiv.classList.remove('hidden', 'bg-emerald-50', 'bg-red-50', 'border-emerald-300', 'border-red-300');

            if (score >= 3) {
                resDiv.classList.add('bg-emerald-50', 'dark:bg-emerald-950/40', 'border-emerald-300', 'text-emerald-800', 'dark:text-emerald-300');
                resDiv.innerHTML = `
                    <h3 class="text-xl font-bold">Գերազանց է! 🎉</h3>
                    <p class="text-sm">Դուք ճիշտ պատասխանեցիք ${score} / ${quizQuestions.length} հարցերին:</p>
                `;
            } else {
                resDiv.classList.add('bg-red-50', 'dark:bg-red-950/40', 'border-red-300', 'text-red-800', 'dark:text-red-300');
                resDiv.innerHTML = `
                    <h3 class="text-xl font-bold">Փորձեք կրկին 💡</h3>
                    <p class="text-sm">Դուք ճիշտ պատասխանեցիք ${score} / ${quizQuestions.length} հարցերին: Խորհուրդ ենք տալիս կրկնել դասերը:</p>
                `;
            }
        }

        function checkAnswer(btn, answer, correct) {
            const parent = btn.parentElement.parentElement;
            const feedback = parent.querySelector('.quiz-feedback');
            feedback.classList.remove('hidden', 'text-emerald-600', 'text-red-500');

            if (answer === correct) {
                feedback.classList.add('text-emerald-600');
                feedback.innerText = 'Ճիշտ է! 👏';
            } else {
                feedback.classList.add('text-red-500');
                feedback.innerText = 'Սխալ է, փորձիր նորից:';
            }
        }

        function toggleLessonComplete(lessonId) {
            if (state.completedLessons.has(lessonId)) {
                state.completedLessons.delete(lessonId);
            } else {
                state.completedLessons.add(lessonId);
            }
            localStorage.setItem('excel_completed_lessons', JSON.stringify([...state.completedLessons]));
            updateProgressBar();
            loadLesson(lessonId);
        }

        function updateProgressBar() {
            let totalLessons = 0;
            courseData.forEach(m => totalLessons += m.lessons.length);
            const done = state.completedLessons.size;
            const pct = Math.round((done / totalLessons) * 100);

            document.getElementById('overall-progress-text').innerText = `${pct}%`;
            document.getElementById('overall-progress-bar').style.width = `${pct}%`;
        }

        function navigateNext(currentId) {
            let allLessons = [];
            courseData.forEach(m => m.lessons.forEach(l => allLessons.push(l.id)));
            const idx = allLessons.indexOf(currentId);
            if (idx !== -1 && idx + 1 < allLessons.length) {
                loadLesson(allLessons[idx + 1]);
            }
        }
    </script>
